<app-mockup-frame tone="dark">
  <div class="app">
    <div class="side">
      <span class="brand"></span>
      @for (item of [0, 1, 2, 3, 4]; track item) {
        <span class="icon" [class.on]="item === 0"></span>
      }
    </div>

    <div class="main">
      <div class="banner">
        <div class="banner-copy">
          <span class="title"></span>
          <span class="meta"></span>
          <span class="meta short"></span>
          <span class="actions"><b></b><b class="ghost"></b></span>
        </div>
        <span class="dots"><i class="on"></i><i></i><i></i><i></i></span>
      </div>

      <span class="row-label"></span>
      <div class="row">
        @for (poster of posters; track $index) {
          <span class="poster" [style.background]="poster"></span>
        }
      </div>

      <span class="row-label short"></span>
      <div class="row ranked">
        @for (rank of ranked; track rank) {
          <span class="rank">
            <b>{{ rank }}</b>
            <span class="poster" [style.background]="posters[rank + 1]"></span>
          </span>
        }
      </div>
    </div>
  </div>
</app-mockup-frame>
