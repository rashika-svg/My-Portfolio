<div class="header-bar" [class.is-raised]="scrolled() || menuOpen()">
  <div class="page-container flex h-18 items-center justify-between gap-6">
    <a href="#top" class="brand" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">{{ profile.initials }}</span>
      <span>{{ profile.name }}</span>
    </a>

    <nav aria-label="Primary" class="hidden md:block">
      <ul class="flex items-center gap-1">
        @for (link of links; track link.id) {
          <li>
            <a
              class="nav-link"
              [href]="'#' + link.id"
              [class.is-active]="activeId() === link.id"
              [attr.aria-current]="activeId() === link.id ? 'true' : null"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-2">
      <a href="#contact" class="btn btn-primary btn-sm hidden sm:inline-flex"
        >Discuss your project</a
      >
      <button
        type="button"
        class="menu-toggle"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" class="size-5" />
        <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-menu"
      aria-label="Mobile"
      class="mobile-menu md:hidden"
      animate.enter="menu-enter"
      animate.leave="menu-leave"
    >
      <ul class="page-container flex flex-col gap-1 pt-3 pb-6">
        @for (link of links; track link.id) {
          <li>
            <a class="mobile-link" [href]="'#' + link.id" (click)="closeMenu()">{{ link.label }}</a>
          </li>
        }
        <li class="mt-3">
          <a href="#contact" class="btn btn-primary w-full" (click)="closeMenu()"
            >Discuss your project</a
          >
        </li>
      </ul>
    </nav>
  }
</div>
