<header
  class="page-container flex flex-wrap items-center justify-between gap-x-10 gap-y-3 py-6 lg:py-8"
>
  <a href="#top" class="font-display text-[1.25rem] font-semibold tracking-[-0.005em]">{{
    name
  }}</a>

  <div class="flex flex-wrap items-center gap-x-10 gap-y-3">
    <nav aria-label="Primary">
      <ul class="flex gap-6 text-[0.9375rem] sm:gap-8">
        @for (link of links; track link.id) {
          <li>
            <a
              class="text-muted underline-offset-[0.3em] transition-colors hover:text-ink hover:underline"
              [href]="'#' + link.id"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <p class="hidden items-center gap-2 text-[0.875rem] lg:flex">
      <span class="size-2 rounded-full bg-accent" aria-hidden="true"></span>
      {{ availability }}
    </p>
  </div>
</header>
