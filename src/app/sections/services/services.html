<app-page-section
  sectionId="services"
  heading="What I can help with"
  note="Most of the work I take on fits one of these. If yours doesn't, ask anyway."
>
  <ul class="grid gap-x-10 sm:grid-cols-2 lg:grid-cols-3">
    @for (service of services; track service.title; let i = $index) {
      <li class="border-t border-rule pt-6 pb-12">
        <h3 class="type-subtitle">{{ service.title }}</h3>
        <p class="mt-3 max-w-96 text-muted">{{ service.description }}</p>
      </li>
    }
  </ul>
</app-page-section>
