<app-page-section
  sectionId="work"
  heading="Selected work"
  tone="dark"
  note="A personal project and two live websites, then three products from my full-time role. Screens and code for the dashboards and signage platform belong to my employer, so those two are described rather than shown."
>
  <div class="divide-y divide-rule">
    @for (project of featured; track project.id) {
      <app-project-entry class="py-20 first:pt-0 lg:py-28" [project]="project" />
    }
  </div>

  <div class="grid gap-8 border-t border-rule pt-14 lg:grid-cols-12 lg:gap-10">
    <h3 class="type-label lg:col-span-4">Other work</h3>
    <div class="grid gap-12 sm:grid-cols-2 lg:col-span-8">
      @for (project of smaller; track project.id) {
        <app-project-entry [project]="project" variant="compact" />
      }
    </div>
  </div>
</app-page-section>
